{# set data = load_setup_py_data() #}

package:
  name: opensees
    #version: "{{ data.get('version') }}"
  version: 0.1.14

source:
  path: ../..

build:
  #script_env: [CONDA_PREFIX]
  script: "MAKEFLAGS=-j8 {{ PYTHON }} -m pip install . -vvv"
    #script: "{{PYTHON}} setup.py install -v -- -- -j10"

requirements:
  build:
    - "{{ compiler('c') }}"
    - "{{ compiler('cxx') }}"
    - "{{ compiler('fortran') }}"
    - cmake
    - "opensees:amoeba-build"
    - setuptools

  host:
    # Conda-Forge
    - tk
    - mysql
    - libblas
    - liblapack
    - arpack
    - python
    - pybind11
    - pip !=22.1.0
    - "opensees:amoeba-build"

  run:
    - python
    - numpy
    - scipy
    - matplotlib


  test:
    requires:
      - pytest
      - nbmake
    imports:
      - opensees
    source_files:
      - notebooks/
    commands:
      - python -m pytest --nbmake notebooks/


about:
  summary: "Nonlinear finite element analysis."
  license: UNKNOWN
  license_family: OTHER
  doc_url: "https://opensees.stairlab.io"
  dev_url: "https://github.com/STAIRLab/OpenSeesRT"

  description: |
    Nonlinear structural analysis.
    

extra:
  recipe-maintainers:
    - claudioperez

